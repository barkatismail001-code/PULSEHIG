<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Graphics (Chip / Pulse Network) -->
  <g transform="translate(10, 10)">
    <rect x="10" y="10" width="60" height="60" rx="12" fill="url(#grad)" />
    <!-- Chip Lines -->
    <path d="M 25 40 L 35 40 L 42 28 L 48 52 L 55 40 L 65 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Nodes -->
    <circle cx="25" cy="40" r="3" fill="#ffffff" />
    <circle cx="65" cy="40" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="95" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Tech<tspan fill="#60a5fa">Pulse</tspan>
  </text>
  <text x="97" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    INSIGHTS &amp; SYSTEMS
  </text>
</svg>
