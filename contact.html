<body data-page="contact">
  <div id="tp-header"></div>
  <main class="container">
    <section class="page-content" style="max-width:780px;margin:30px auto">
      <h1>Contact us</h1>
      <p>Questions, corrections or ideas for a guide? Send a message or email <a href="mailto:contact@pulsehig.com">contact@pulsehig.com</a>.</p>
      <form class="contact-form" id="contactForm" method="POST" action="https://api.web3forms.com/submit" style="margin-top:20px">
        <input type="hidden" name="access_key" value="3cdd18de-34b1-42eb-bdc8-773a77f36f92">
        <input type="hidden" name="subject" value="New message from TechPulse website">
        <input type="hidden" name="from_name" value="TechPulse Contact Form">
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">
        <label for="cname" style="display:block;font-weight:600;margin:14px 0 6px">Name</label>
        <input type="text" id="cname" name="name" required autocomplete="name" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);color:var(--text);font:inherit">
        <label for="cemail" style="display:block;font-weight:600;margin:14px 0 6px">Email</label>
        <input type="email" id="cemail" name="email" required autocomplete="email" style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);color:var(--text);font:inherit">
        <label for="cmsg" style="display:block;font-weight:600;margin:14px 0 6px">Message</label>
        <textarea id="cmsg" name="message" rows="6" required style="width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);color:var(--text);font:inherit;resize:vertical"></textarea>
        <button type="submit" class="btn-primary" style="margin-top:16px;width:100%">Send message</button>
        <p id="contactStatus" aria-live="polite" style="margin-top:12px;min-height:1.4em"></p>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var f = document.getElementById('contactForm'), s = document.getElementById('contactStatus');
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var b = f.querySelector('button'); b.disabled = true; s.textContent = 'Sending…';
        fetch(f.action, { method: 'POST', body: new FormData(f), headers: { Accept: 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.success) { s.textContent = '✓ Thanks! Your message has been sent.'; f.reset(); }
            else { s.textContent = 'Could not send. Please email contact@pulsehig.com.'; }
          })
          .catch(function () { s.textContent = 'Could not send. Please email contact@pulsehig.com.'; })
          .then(function () { b.disabled = false; });
      });
    })();
  </script>
  <div id="tp-footer"></div>
  <script src="/js/config.js?v=6e0b38d8" defer></script>

</body>
