name: Translate Articles (Auto)

on:
  workflow_dispatch:        # يدويًا
    inputs:
      limit:
        description: 'Number of articles to translate'
        required: false
        default: '5'
  schedule:
    # كل يوم الساعة 3 صباحًا UTC (بعد بوت المقالات)
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install @supabase/supabase-js

      - name: Translate articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: node scripts/translate-articles.mjs --limit=${{ github.event.inputs.limit || 5 }}

      - name: Rebuild SEO files (with translations)
        run: node scripts/generate-seo.mjs

      - name: Commit changes
        run: |
          git config user.name "techpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A a sitemap.xml rss.xml llms.txt data/static-slugs.json data/auto-articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-translate articles [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes"
          fi
