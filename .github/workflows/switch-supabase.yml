name: Switch site to a new Supabase project

# Manual. Rewrites the Supabase URL + public key everywhere in the repo, then commits.
# Do this AFTER you updated the repository secrets SUPABASE_URL and SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'New project URL, e.g. https://abcdefghijklmnop.supabase.co'
        required: true
      publishable_key:
        description: 'New PUBLIC key (sb_publishable_...). Never paste the secret/service key here'
        required: true

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rewrite URL and key
        env:
          NEW_URL: ${{ inputs.supabase_url }}
          NEW_KEY: ${{ inputs.publishable_key }}
        run: node scripts/switch-supabase.mjs "$NEW_URL" "$NEW_KEY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to change"; exit 0; }
          git commit -m "chore: switch to new Supabase project"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
