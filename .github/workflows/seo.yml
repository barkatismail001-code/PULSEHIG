name: Rebuild Static Pages (manual)

# MANUAL ONLY. Nothing is published or generated automatically.
# After you save an article in admin.html, open Actions -> "Rebuild Static Pages (manual)" -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generate static pages, sitemaps and feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/generate-seo.mjs
      - name: Commit and push changes
        run: |
          git config user.name "techpulse-build"
          git config user.email "build@users.noreply.github.com"
          git add -A -- a series rss sitemap*.xml rss.xml robots.txt llms.txt index.html articles.html data js/slug-map.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild static pages (manual run) [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
