name: Set up a NEW Supabase project (all tables + content)

# Manual only. Use it ONCE on a fresh Supabase project.
# Needs secrets: SUPABASE_ACCESS_TOKEN (account token) and SUPABASE_URL (the NEW project URL).
# It runs the files listed in database/setup-order.txt, in order, and stops at the first error.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run all SQL files on the new project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Add the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_URL first"; exit 1
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/${REF}/database/query"
          run_sql () {
            jq -Rs '{query: .}' "$1" > body.json
            STATUS=$(curl -sS -o response.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d @body.json)
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              echo "::error::$1 failed (HTTP $STATUS)"; cat response.json; echo; exit 1
            fi
            echo "OK  $1 (HTTP $STATUS)"
          }
          grep -v '^\s*#' database/setup-order.txt | grep -v '^\s*$' | while read -r f; do run_sql "$f"; done
          echo 'select (select count(*) from public.articles) as articles, (select count(*) from public.courses) as courses, (select count(*) from public.lectures) as lectures, (select count(*) from public.assignments) as assignments, (select count(*) from public.exams) as exams;' > check.sql
          run_sql check.sql
          cat response.json; echo
