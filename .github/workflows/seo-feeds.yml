name: Update sitemap and RSS
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: picks up new articles from Supabase
  workflow_dispatch: {}     # manual run from the Actions tab
  push:
    paths: ['scripts/generate-seo.mjs', 'data/articles.json', 'assets/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/generate-seo.mjs
      - name: Commit if changed
        run: |
          git config user.name "techpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A a sitemap.xml rss.xml robots.txt
          git diff --cached --quiet || (git commit -m "chore: update sitemap and rss" && git push)
