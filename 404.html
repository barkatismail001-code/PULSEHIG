<body>
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <h1>Page not found</h1>
    <p style="color:var(--text-muted);max-width:520px;margin:16px auto">The page you are looking for does not exist or has been moved.</p>

  </div>

  <script>
    /* Old / mistyped article links: /a/<slug>.html where the slug is longer or shorter than the real file name
       (e.g. ...-with-esp32.html instead of ...-with.html). Find the closest real article and go there. */
    (function () {
      var m = /^\/a\/([^\/]+)\.html$/.exec(location.pathname);
      if (!m) return;
      var want = decodeURIComponent(m[1]).toLowerCase();
      Promise.all([
        fetch('/data/static-slugs.json').then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
        fetch('/data/manual-articles.json').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; })
      ]).then(function (res) {
        var slugs = Object.keys(res[0]).map(function (k) { return res[0][k]; })
          .concat(res[1].map(function (x) { return x.slug; })).filter(Boolean);
        var best = '';
        slugs.forEach(function (c) {
          var near = Math.min(c.length, want.length) >= 25 && (want.indexOf(c) === 0 || c.indexOf(want) === 0);
          if (near && c.length > best.length) best = c;
        });
        if (best && best !== want) location.replace('/a/' + best + '.html');
      });
    })();
  </script>
